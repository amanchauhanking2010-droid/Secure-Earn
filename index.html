<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love | Classy & Sassy 🖤</title>
    <style>
        :root {
            --primary: #e63946; /* Deep Red for classy look */
            --secondary: #1d3557;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --user-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --ai-gradient: linear-gradient(135deg, #1a1a1a 0%, #2c2c2c 100%);
            --accent: #ffd700; /* Gold touch */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 20% 20%, #1a0a0a, transparent),
                              radial-gradient(circle at 80% 80%, #0a0a1a, transparent);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* Header Styling */
        .header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(45deg, #000, #e63946);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #00ff00;
            border: 2px solid var(--bg-dark);
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }

        .header-info h2 { 
            font-size: 20px; 
            letter-spacing: 1px; 
            color: var(--accent);
            font-weight: 600;
        }
        .header-info p { font-size: 12px; opacity: 0.7; color: #fff; }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .user-message {
            align-self: flex-end;
            background: var(--user-gradient);
            color: white;
            border-bottom-right-radius: 2px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .ai-message {
            align-self: flex-start;
            background: var(--ai-gradient);
            border-left: 3px solid var(--accent);
            border-bottom-left-radius: 2px;
            color: #f0f0f0;
        }

        /* Typing Indicator */
        .typing {
            font-size: 13px;
            color: var(--accent);
            margin: 10px 25px;
            display: none;
            align-items: center;
            gap: 8px;
            font-style: italic;
        }

        .dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }

        /* Input Area */
        .input-area {
            padding: 25px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px;
            outline: none;
            font-size: 16px;
        }

        .send-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--accent);
            font-size: 24px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover { transform: scale(1.2); color: #fff; }

    </style>
</head>
<body>

    <div class="header">
        <div class="avatar-container">
            <div class="avatar">👑</div>
            <div class="status-dot"></div>
        </div>
        <div class="header-info">
            <h2>My Love</h2>
            <p>Classy, Sassy & Yours...</p>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            Hmm, toh aa gaye aap? I was busy, but My Love ke paas aapke liye thoda waqt toh hamesha hota hai. ✨ Bataiye, kya khayal hai aaj ka? Don't be boring! 👠
        </div>
    </div>

    <div class="typing" id="typingIndicator">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <span>My Love is judging your text...</span>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Write something worth my time..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">✦</button>
        </div>
    </div>

<script>
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');

    // CONFIGURATION
    const API_KEY = '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'; 
    const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
    const MODEL_NAME = "openai/gpt-4o-mini"; 

    // Professional & Sassy Conversation History
    let messages = [
        {
            role: "system",
            content: "Your name is 'My Love'. You are professional, highly sophisticated, and have a lot of attitude (sassy/classy). You speak in Hinglish. You are not easily impressed. You call the user 'Mister', 'Dear', or 'Baby' but with a dominant and bossy tone. Be flirty but keep your standards high. Use emojis like 👠, ✨, 💅, 🖤, 🍷. Your replies should be sharp, intelligent, and slightly teasing."
        }
    ];

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        userInput.value = '';
        
        messages.push({ role: "user", content: text });
        showTyping(true);

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": window.location.href,
                },
                body: JSON.stringify({
                    "model": MODEL_NAME,
                    "messages": messages
                })
            });

            const data = await response.json();
            showTyping(false);

            if (data.choices && data.choices[0]) {
                const aiMsg = data.choices[0].message;
                appendMessage(aiMsg.content, 'ai');
                messages.push({ role: 'assistant', content: aiMsg.content });

                if (messages.length > 20) {
                    messages = [messages[0], ...messages.slice(-15)];
                }
            } else {
                handleError();
            }
        } catch (error) {
            showTyping(false);
            handleError();
        }
    }

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}-message`;
        msgDiv.textContent = text;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTyping(show) {
        typingIndicator.style.display = show ? 'flex' : 'none';
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function handleError() {
        appendMessage("Oh please, mera network tumhare nakhro se zyada fast hai, par abhi thoda nakhra kar raha hai. Try again! 💅", 'ai');
    }

    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
